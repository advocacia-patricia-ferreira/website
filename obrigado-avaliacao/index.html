<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pela Avaliação | Advocacia Patrícia Ferreira</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        .navbar-brand {
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
        }
        .text-uppercase {
            text-transform: uppercase;
        }
        .text-tema-escuro {
            color: #1a2e40; /* Tom escuro elegante alinhado à identidade visual */
            margin: 0;
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo-img {
            max-width: 120px; /* Ajuste o tamanho conforme necessário */
            height: auto;
        }
        h2 {
            color: #1a2e40;
            margin-bottom: 20px;
            font-size: 22px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            background-color: #1a2e40;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn-home:hover {
            background-color: #111e2a;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logotipo Centralizado -->
        <a href="https://advocaciapatriciaferreira.com.br" class="navbar-brand">
            <h1 class="text-uppercase text-tema-escuro">
                <img src="https://advocaciapatriciaferreira.com.br/img/logomin.jpg" alt="Advocacia Patrícia Ferreira" class="logo-img">
                <span data-const="NOME" data-processed="true">Advocacia Patrícia Ferreira</span>
            </h1>
        </a>

        <h2>Sua opinião é muito importante!</h2>
        <p>Agradecemos sinceramente por dedicar um momento do seu dia para avaliar a nossa atuação no Google Maps. Seu feedback nos ajuda a manter a excelência e o compromisso com soluções jurídicas seguras.</p>
        <a href="https://advocaciapatriciaferreira.com.br" class="btn-home">Voltar para a Home</a>
    </div>

</body>
</html>
